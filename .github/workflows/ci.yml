name: CI

on:
  pull_request:
    branches:
      - develop
      - backend
      - android
      - infra

  push:
    branches:
      - develop

  # 필요할 때 GitHub UI에서 수동 실행할 수 있다.
  workflow_dispatch:

# CI는 Repository 내용을 읽기만 하면 된다.
permissions:
  contents: read

jobs:
  backend:
    name: Backend Build and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      # CI Runner에 Repository 소스를 Checkout한다.
      - name: Checkout repository
        uses: actions/checkout@v7

      # Backend 프로젝트가 사용하는 JDK 21 환경을 구성한다.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Gradle 실행 환경과 Dependency Cache를 구성한다.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Windows에서 생성된 Repository에서도 Wrapper를 실행할 수 있게 한다.
      - name: Grant execute permission
        run: chmod +x gradlew

      # Build 과정에서 Testcontainers가 임시 MySQL을 생성하고
      # Flyway Migration 적용 후 Backend Test까지 실행한다.
      - name: Build and test backend
        run: ./gradlew build --no-daemon

  android:
    name: Android Test and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      # CI Runner에 Repository 소스를 Checkout한다.
      - name: Checkout repository
        uses: actions/checkout@v7

      # Android Gradle 프로젝트가 사용할 JDK 21 환경을 구성한다.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # local.properties 없이 CI용 Android SDK 환경을 구성한다.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0"

      # Gradle 실행 환경과 Dependency Cache를 구성한다.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Grant execute permission
        run: chmod +x gradlew

      # JVM 기반 Android Unit Test를 실행한다.
      - name: Run Android unit tests
        run: ./gradlew test --no-daemon

      # Debug APK가 실제로 생성 가능한지 검증한다.
      - name: Build Android debug
        run: ./gradlew assembleDebug --no-daemon